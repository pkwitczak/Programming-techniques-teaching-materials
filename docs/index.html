<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Techniki Programowania — Materiały dydaktyczne | WNiT UZ</title>
  <style>
    :root {
      --bg-page: #f2f4f7;
      --bg-surface: #ffffff;
      --bg-subtle: #e9edf2;
      --text-main: #18202c;
      --text-muted: #596577;
      --border: #d5dce4;
      --uz-navy: #3a5683;
      --uz-teal: #2f856d;
      --shadow-sm: 0 2px 6px rgba(24, 32, 44, 0.04);
      --shadow-md: 0 10px 24px rgba(24, 32, 44, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.55;
      padding: 2rem 1.25rem 3rem;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    /* Nagłówek z logo WNiT */
    header {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-top: 4px solid var(--uz-navy);
      border-radius: 12px;
      padding: 1.75rem 2rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      flex-wrap: wrap;
    }

    .brand img {
      height: 68px;
      width: auto;
      object-fit: contain;
    }

    .brand-divider {
      width: 1px;
      height: 54px;
      background: var(--border);
    }

    .header-text h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .header-text p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    /* Pasek wyszukiwania, sortowania i filtrów */
    .toolbar {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow-sm);
    }

    .search-row {
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    input[type="search"], select {
      padding: 0.65rem 0.95rem;
      font-size: 0.92rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-page);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    input[type="search"] {
      flex: 1;
      min-width: 260px;
    }

    input[type="search"]:focus, select:focus {
      border-color: var(--uz-navy);
      background: var(--bg-surface);
    }

    select {
      cursor: pointer;
      min-width: 210px;
      font-weight: 500;
    }

    .tags-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 1rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--bg-subtle);
    }

    .tags-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-right: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .filter-chip {
      border: 1px solid var(--border);
      background: var(--bg-page);
      color: var(--text-muted);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-chip:hover {
      border-color: var(--uz-navy);
      color: var(--text-main);
    }

    .filter-chip.active {
      background: var(--uz-navy);
      border-color: var(--uz-navy);
      color: #ffffff;
    }

    /* Siatka kafelków */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: #b4c0ce;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }

    .release-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.22rem 0.6rem;
      border-radius: 6px;
      background: rgba(47, 133, 109, 0.12);
      color: var(--uz-teal);
      border: 1px solid rgba(47, 133, 109, 0.25);
    }

    .release-badge.no-release {
      background: var(--bg-subtle);
      color: var(--text-muted);
      border-color: transparent;
      font-weight: 500;
    }

    .card-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      line-height: 1.35;
      display: block;
    }

    .card-title:hover {
      color: var(--uz-navy);
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.5rem;
      margin-bottom: 1.1rem;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }

    .tag {
      background: var(--bg-subtle);
      color: var(--text-main);
      padding: 0.18rem 0.55rem;
      border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.76rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border-color 0.15s;
    }

    .tag:hover {
      border-color: var(--uz-navy);
    }

    .tag.lang {
      background: rgba(58, 86, 131, 0.1);
      color: var(--uz-navy);
      font-weight: 600;
    }

    .card-footer {
      padding-top: 0.9rem;
      border-top: 1px solid var(--bg-subtle);
      display: flex;
      gap: 0.6rem;
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 0.55rem 0.9rem;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }

    .btn-primary {
      background: var(--uz-navy);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #2b4164;
    }

    .btn-secondary {
      background: var(--bg-page);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-subtle);
    }

    footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    @media (max-width: 680px) {
      .brand-divider { display: none; }
      header { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <img
          src="https://wnit.uz.zgora.pl/fcp/BHVENFTgGFAMKCAkFBwIDHU5REB4fFhw/170/public/aktualnosci/2025/logo_wnit_pl_pion_rgb.png"
          alt="Logo Wydziału Nauk Inżynieryjno-Technicznych Uniwersytetu Zielonogórskiego"
        >
        <div class="brand-divider"></div>
        <div class="header-text">
          <h1>Techniki Programowania — Zadania</h1>
          <p>Repozytoria materiałów laboratoryjnych i projektowych dla studentów</p>
        </div>
      </div>
    </header>

    <section class="toolbar">
      <div class="search-row">
        <input type="search" id="search" placeholder="Szukaj po nazwie, opisie lub tagu...">
        <select id="sort" aria-label="Sortowanie zadań">
          <option value="date-desc">Sortuj: Najnowsze (data)</option>
          <option value="date-asc">Sortuj: Najstarsze (data)</option>
          <option value="release-desc">Sortuj: Numer wydania (malejąco)</option>
          <option value="name-asc">Sortuj: Nazwa (A–Z)</option>
        </select>
      </div>
      <div class="tags-bar" id="tags-bar">
        <span class="tags-label">Tagi:</span>
      </div>
    </section>

    <main class="grid" id="repo-list"></main>

    <footer>
      <span>Synchronizacja z GitHub Projects: <strong id="updated-at">—</strong></span>
      <span>Wyświetlane zadania: <strong id="repo-count">0</strong></span>
    </footer>
  </div>

   <script>
    const MOCK_DATA = {
      generatedAt: "2026-11-22T12:00:00Z",
      repositories: [
        {
          name: "lab-01-podstawy-skladni",
          description: "Struktura programu, typy danych, instrukcje sterujące oraz podstawowe operacje wejścia/wyjścia.",
          url: "https://github.com",
          updatedAt: "2026-10-08T12:00:00Z",
          language: "C++",
          topics: ["lab-01", "podstawy", "semestr-1"],
          release: { tag: "v1.2.0", date: "2026-10-08T12:00:00Z", url: "https://github.com" }
        },
        {
          name: "lab-02-tablice-i-wskazniki",
          description: "Zarządzanie pamięcią dynamiczną, arytmetyka wskaźników i przekazywanie tablic do funkcji.",
          url: "https://github.com",
          updatedAt: "2026-10-15T14:30:00Z",
          language: "C++",
          topics: ["lab-02", "wskazniki", "pamiec"],
          release: { tag: "v1.1.0", date: "2026-10-15T14:30:00Z", url: "https://github.com" }
        },
        {
          name: "lab-03-struktury-i-pliki",
          description: "Tworzenie własnych typów strukturalnych oraz serializacja danych do plików tekstowych i binarnych.",
          url: "https://github.com",
          updatedAt: "2026-10-22T09:10:00Z",
          language: "C++",
          topics: ["lab-03", "pliki", "struktury"],
          release: { tag: "v2.0.1", date: "2026-10-22T09:10:00Z", url: "https://github.com" }
        },
        {
          name: "lab-04-obliczenia-macierzowe",
          description: "Implementacja operacji na macierzach rzadkich i rozwiązywanie układów równań liniowych.",
          url: "https://github.com",
          updatedAt: "2026-11-05T16:20:00Z",
          language: "Python",
          topics: ["lab-04", "algorytmy", "macierze"],
          release: { tag: "v1.0.0", date: "2026-11-05T16:20:00Z", url: "https://github.com" }
        },
        {
          name: "projekt-semestralny-symulator",
          description: "Szablon repozytorium do projektu zaliczeniowego wraz z zestawem testów jednostkowych.",
          url: "https://github.com",
          updatedAt: "2026-11-19T11:45:00Z",
          language: "C++",
          topics: ["projekt", "zaliczenie", "testy"],
          release: null
        }
      ]
    };

    let allRepos = [];
    let selectedTag = null;

    function getEffectiveDate(repo) {
      return new Date((repo.release && repo.release.date) || repo.updatedAt).getTime();
    }

    function buildTagBar(repos) {
      const bar = document.getElementById('tags-bar');
      const tagSet = new Set();
      repos.forEach(r => (r.topics || []).forEach(t => tagSet.add(t)));

      const tags = Array.from(tagSet).sort((a, b) => a.localeCompare(b, 'pl'));
      bar.innerHTML = '<span class="tags-label">Tagi:</span>';

      const allBtn = document.createElement('button');
      allBtn.type = 'button';
      allBtn.className = 'filter-chip' + (selectedTag === null ? ' active' : '');
      allBtn.textContent = 'Wszystkie';
      allBtn.onclick = () => { selectedTag = null; updateView(); };
      bar.appendChild(allBtn);

      tags.forEach(tag => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-chip' + (selectedTag === tag ? ' active' : '');
        btn.textContent = '#' + tag;
        btn.onclick = () => {
          selectedTag = (selectedTag === tag) ? null : tag;
          updateView();
        };
        bar.appendChild(btn);
      });
    }

    function updateView() {
      const query = document.getElementById('search').value.toLowerCase().trim();
      const sortMode = document.getElementById('sort').value;

      document.querySelectorAll('.filter-chip').forEach(btn => {
        if (btn.textContent === 'Wszystkie') {
          btn.classList.toggle('active', selectedTag === null);
        } else {
          btn.classList.toggle('active', btn.textContent === '#' + selectedTag);
        }
      });

      let filtered = allRepos.filter(r => {
        const matchesTag = !selectedTag || (r.topics && r.topics.includes(selectedTag));
        const matchesQuery = !query ||
          r.name.toLowerCase().includes(query) ||
          (r.description && r.description.toLowerCase().includes(query)) ||
          (r.language && r.language.toLowerCase().includes(query)) ||
          (r.release && r.release.tag.toLowerCase().includes(query)) ||
          (r.topics && r.topics.some(t => t.toLowerCase().includes(query)));
        return matchesTag && matchesQuery;
      });

      filtered.sort((a, b) => {
        if (sortMode === 'date-desc') return getEffectiveDate(b) - getEffectiveDate(a);
        if (sortMode === 'date-asc') return getEffectiveDate(a) - getEffectiveDate(b);
        if (sortMode === 'release-desc') {
          const relA = (a.release && a.release.tag) || '';
          const relB = (b.release && b.release.tag) || '';
          return relB.localeCompare(relA, undefined, { numeric: true });
        }
        return a.name.localeCompare(b.name, 'pl');
      });

      renderCards(filtered);
    }

    function renderCards(repos) {
      const container = document.getElementById('repo-list');
      document.getElementById('repo-count').textContent = repos.length;

      if (!repos.length) {
        container.innerHTML = '<p style="color: var(--text-muted);">Brak zadań spełniających wybrane kryteria filtrowania.</p>';
        return;
      }

      container.innerHTML = repos.map(repo => {
        const hasRelease = repo.release && repo.release.tag;
        const releaseHtml = hasRelease
          ? `<span class="release-badge">Wydanie ${repo.release.tag}</span>`
          : `<span class="release-badge no-release">Wersja robocza</span>`;

        const rawDate = (hasRelease && repo.release.date) ? repo.release.date : repo.updatedAt;
        const formattedDate = new Date(rawDate).toLocaleDateString('pl-PL', {
          day: '2-digit', month: '2-digit', year: 'numeric'
        });

        const langTag = repo.language ? `<span class="tag lang">${repo.language}</span>` : '';
        const topicTags = (repo.topics || [])
          .map(t => `<span class="tag" onclick="filterByTag('${t}')">#${t}</span>`)
          .join('');

        const releaseBtn = hasRelease
          ? `<a class="btn btn-secondary" href="${repo.release.url}" target="_blank" rel="noopener">Release</a>`
          : '';

        return `
          <article class="card">
            <div>
              <div class="card-top">
                ${releaseHtml}
                <span class="card-date">${formattedDate}</span>
              </div>
              <a class="card-title" href="${repo.url}" target="_blank" rel="noopener">${repo.name}</a>
              <p class="card-desc">${repo.description || 'Brak opisu zadania.'}</p>
            </div>
            <div>
              <div class="card-tags">
                ${langTag}
                ${topicTags}
              </div>
              <div class="card-footer">
                <a class="btn btn-primary" href="${repo.url}" target="_blank" rel="noopener">Repozytorium &rarr;</a>
                ${releaseBtn}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    window.filterByTag = function(tag) {
      selectedTag = (selectedTag === tag) ? null : tag;
      updateView();
    };

    function initApp(data, isMock) {
      allRepos = data.repositories || [];
      document.getElementById('updated-at').textContent = isMock
        ? 'Tryb podglądu (przykładowe dane)'
        : new Date(data.generatedAt).toLocaleString('pl-PL');
      buildTagBar(allRepos);
      updateView();
    }

    // Najpierw od razu narysuj przykłady, żeby ekran nigdy nie był pusty
    initApp(MOCK_DATA, true);

    // Następnie spróbuj wczytać prawdziwy plik data.json, jeśli ma już dane
    fetch('data.json?v=' + Date.now())
      .then(res => res.ok ? res.json() : null)
      .then(data => {
        if (data && Array.isArray(data.repositories) && data.repositories.length > 0) {
          initApp(data, false);
        }
      })
      .catch(() => {});

    document.getElementById('search').addEventListener('input', updateView);
    document.getElementById('sort').addEventListener('change', updateView);
  </script>
