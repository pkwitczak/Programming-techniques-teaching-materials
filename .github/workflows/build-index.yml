name: Build data.json based on docs/repos_data

on:
  push:
    paths:
      - 'docs/repos_data/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Consolidate files docs/repos_data/*.json to docs/data.json
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const dir = "docs/repos_data";
          const files = fs.existsSync(dir)
            ? fs.readdirSync(dir).filter(f => f.endsWith(".json"))
            : [];

          const repositories = files.map(f => {
            const content = fs.readFileSync(path.join(dir, f), "utf8");
            return JSON.parse(content);
          });

          fs.writeFileSync("docs/data.json", JSON.stringify({
            generatedAt: new Date().toISOString(),
            repositories
          }, null, 2));
          '

      - name: Zapisz docs/data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add docs/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs/data.json consolidated" && git push)
