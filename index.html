<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zadania z programowania — Wydział Nauk Technicznych (Podgląd)</title>
  <style>
    :root {
      --bg-page: #f5f5f7;
      --bg-card: #ffffff;
      --text-main: #1d1d1f;
      --text-muted: #6e6e73;
      --border: #d2d2d7;
      --accent: #3a3a3c;
      --accent-hover: #1d1d1f;
      --tag-bg: #ebebf0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.35rem;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    input[type="search"] {
      flex: 1;
      min-width: 240px;
      padding: 0.6rem 0.9rem;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-main);
      outline: none;
    }

    input[type="search"]:focus {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.9rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      transition: border-color 0.15s ease;
    }

    .card:hover {
      border-color: var(--accent);
    }

    .card-info {
      flex: 1;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
    }

    .card-title:hover {
      text-decoration: underline;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .tag {
      background: var(--tag-bg);
      color: var(--text-main);
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
    }

    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 6px;
      white-space: nowrap;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    footer {
      margin-top: 3rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    @media (max-width: 600px) {
      .card { flex-direction: column; align-items: flex-start; }
      .btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Zadania z programowania</h1>
      <p>Wydział Nauk Technicznych — repozytoria materiałów i list zadań laboratoryjnych</p>
    </header>

    <div class="controls">
      <input type="search" id="search" placeholder="Szukaj po nazwie zadania, opisie lub języku (np. C++, Python)...">
    </div>

    <main class="grid" id="repo-list"></main>

    <footer>
      <span>Aktualizacja listy: <strong id="updated-at">—</strong></span>
      <span>Liczba repozytoriów: <strong id="repo-count">0</strong></span>
    </footer>
  </div>

  <script>
    // Przykładowe dane tylko do lokalnego podglądu
    const mockData = {
      generatedAt: new Date().toISOString(),
      repositories: [
        {
          name: "lab-01-wprowadzenie-cpp",
          description: "Instrukcje warunkowe, pętle oraz operacje wejścia/wyjścia w języku C++.",
          url: "#",
          updatedAt: "2026-10-14T10:20:00Z",
          language: "C++",
          topics: ["podstawy", "semestr-1", "lab-01"]
        },
        {
          name: "lab-02-wskazniki-i-pamiec",
          description: "Dynamiczna alokacja pamięci, arytmetyka wskaźników i tablice wielowymiarowe.",
          url: "#",
          updatedAt: "2026-10-21T14:05:00Z",
          language: "C++",
          topics: ["wskazniki", "pamiec", "lab-02"]
        },
        {
          name: "lab-03-analiza-danych-numerycznych",
          description: "Przetwarzanie danych pomiarowych i podstawy obliczeń macierzowych.",
          url: "#",
          updatedAt: "2026-11-02T09:15:00Z",
          language: "Python",
          topics: ["numpy", "metody-numeryczne", "lab-03"]
        },
        {
          name: "projekt-zaliczeniowy-symulacja",
          description: "Szablon projektu zaliczeniowego: symulacja układu mechanicznego z wizualizacją.",
          url: "#",
          updatedAt: "2026-11-18T16:40:00Z",
          language: "Python",
          topics: ["projekt", "zaliczenie"]
        }
      ]
    };

    const allRepos = mockData.repositories;
    document.getElementById('updated-at').textContent = new Date(mockData.generatedAt).toLocaleString('pl-PL');

    function render(repos) {
      const container = document.getElementById('repo-list');
      document.getElementById('repo-count').textContent = repos.length;

      if (!repos.length) {
        container.innerHTML = '<p style="color: var(--text-muted);">Brak repozytoriów spełniających kryteria.</p>';
        return;
      }

      container.innerHTML = repos.map(repo => {
        const lang = repo.language ? `<span class="tag">${repo.language}</span>` : '';
        const topics = (repo.topics || []).map(t => `<span class="tag">#${t}</span>`).join('');
        const date = new Date(repo.updatedAt).toLocaleDateString('pl-PL');

        return `
          <article class="card">
            <div class="card-info">
              <a class="card-title" href="${repo.url}">${repo.name}</a>
              <p class="card-desc">${repo.description || 'Brak opisu zadania.'}</p>
              <div class="meta">
                ${lang}
                ${topics}
                <span>Aktualizacja: ${date}</span>
              </div>
            </div>
            <a class="btn" href="${repo.url}">Otwórz kod &rarr;</a>
          </article>
        `;
      }).join('');
    }

    render(allRepos);

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.valBeue.toLowerCase().trim();
      const filtered = allRepos.filter(r =>
        r.name.toLowerCase().includes(q) ||
        (r.description && r.description.toLowerCase().includes(q)) ||
        (r.language && r.language.toLowerCase().includes(q)) ||
        (r.topics && r.topics.some(t => t.toLowerCase().includes(q)))
      );
      render(filtered);
    });
  </script>
</body>
</html>
